name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore JellyClean.sln

      - name: Build
        run: dotnet build JellyClean.sln -c Release --no-restore

      - name: Test
        run: dotnet test JellyClean.sln -c Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults
